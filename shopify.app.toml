# Cited — Product Reviews & AI Visibility
#
# Keep annotations as `#` comments. The CLI validates this file against a
# closed schema and rejects any unrecognised top-level key, so a `_comment`
# string here fails `shopify app deploy` outright.

client_id = "d7e7cc14dd8022014fdaff06422f2542"
name = "Cited"
# App handles are globally unique across every Shopify app, not just this org,
# and `cited` is already taken — deploy fails with "App handle must be unique".
# This one appears in merchant-facing URLs
# (admin.shopify.com/store/:store/apps/:handle and the billing plan link), so
# it must stay in step with SHOPIFY_APP_HANDLE in the environment. Cheap to
# change now, effectively permanent once merchants have installed.
handle = "cited-reviews"
application_url = "https://cited.solnix.store"
embedded = true

[access_scopes]
# `write_product_reviews` is a RESTRICTED scope for the standard
# `product_review` metaobject. Test access was GRANTED on 2026-08-14 and
# is currently active on the DEV TEST STORE ONLY — final approval still
# requires submitting the working implementation for review.
#
# Keep this in step with APP_SCOPES in lib/shopify/app-identity.ts and
# SHOPIFY_SCOPES in the environment. The health check compares all three,
# so a mismatch fails every production deploy. See ACCESS-REQUEST.md §6.
#
# `write_products`, not `read_products`: Shopify requires approved review apps
# to maintain the `reviews.rating` / `reviews.rating_count` product metafields,
# and `metafieldsSet` requires the same access as mutating the owner resource.
# Read access returned ACCESS_DENIED and no rating ever reached Shopify.
#
# `write_files` stores review photos in the merchant's own Shopify Files rather
# than a bucket of ours. No third-party account, no credentials to leak, no
# egress bill — and a merchant who uninstalls keeps their shoppers' photos.
#
# `read_themes` is READ ONLY and is what lets the setup checklist tell the
# truth. Detection used to fetch a product page, which a password-protected
# storefront redirects — so the step stayed grey however the merchant set it
# up, and a disabled app embed looked identical to an enabled one. Note this
# is deliberately not `write_themes`: Cited never edits a merchant's theme.
scopes = "write_products,read_orders,read_customers,read_metaobjects,write_product_reviews,write_files,read_themes"
use_legacy_install_flow = false

[auth]
# Must match the deployed host exactly — Shopify rejects an OAuth callback to
# any URL not listed here, and the comparison is literal (scheme, host, path).
#
# No localhost entries: `automatically_update_urls_on_dev = true` below means
# `shopify app dev` rewrites these to its tunnel URL for the duration of a dev
# session and restores them on the next deploy, so hardcoding a local pair
# would only add URLs that are never the ones actually in use.
redirect_urls = [
  "https://cited.solnix.store/api/auth/callback",
  "https://cited.solnix.store/api/auth/shopify/callback",
]

# Storefront review submission.
#
# Gives the theme block a same-origin URL to post to — `/apps/cited/reviews` on
# the merchant's own domain — so the review form works with JavaScript
# disabled, which is the entire premise of a server-rendered block. Shopify
# signs every proxied request; app/api/proxy/reviews verifies that signature
# before touching the database.
#
# `subpath` must stay in step with the form action in
# extensions/reviews-widget/blocks/reviews.liquid — Liquid has no way to read
# this file, so the path is written out in both places.
[app_proxy]
url = "https://cited.solnix.store/api/proxy"
subpath = "cited"
prefix = "apps"

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/api/webhooks/app-subscriptions-update"

  # Drives the review-request engine.
  [[webhooks.subscriptions]]
  topics = [ "orders/fulfilled", "orders/paid" ]
  uri = "/api/webhooks/orders"

  # Keeps the local product mirror and rating metafields in step.
  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update", "products/delete" ]
  uri = "/api/webhooks/products"

  # Metaobject change feed — MANDATORY for approved review apps.
  #
  # Reviews can be created, edited or deleted outside this app: by the
  # merchant in admin, by another approved review app, or by Shopify. Without
  # these we would serve stale review data while believing we are
  # authoritative.
  #
  # Scoped to our type so we are not woken for every metaobject in the shop.
  #
  # `filter`, NOT `sub_topic`: sub-topics were deprecated in Admin API 2024-07
  # and the metaobjects/* topics now REQUIRE a filter. We are on 2025-07, so
  # sub_topic would be rejected. `product_review` is a Shopify STANDARD
  # definition, so the plain type is correct here — an app-owned definition
  # would need the full `app--{id}--{namespace}` form instead.
  [[webhooks.subscriptions]]
  topics = [ "metaobjects/create", "metaobjects/update", "metaobjects/delete" ]
  filter = "type:product_review"
  uri = "/api/webhooks/metaobjects"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact",
  ]
  uri = "/api/webhooks/privacy"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""
